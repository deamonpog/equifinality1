name: ruletree_rowcol

data:
  system: rule_trees
  data_dir: GENERATED_DATA
  grid_size: 50
  schelling_patch_size: 2
  num_snapshots: 5
  train_frac: 0.8
  val_frac: 0.1
  n_tree_candidates: 10000
  tree_max_depth: 3

model:
  model_size: base
  dropout: 0.1
  # Decomposed row/column spatial embeddings (ablation vs. time_space).
  positional_encoding: time_row_col

training:
  # batch_size 16 fits comfortably on a 48GB L40S at fp32.
  # For 80GB+ cards (H100, H200, A100 80GB) you can safely raise to 32.
  batch_size: 16
  lr: 3.0e-4
  weight_decay: 0.1
  grad_clip: 1.0
  epochs: 30
  label_smoothing: 0.05
  seed: 42
  device: cuda
  lr_scheduler: cosine
  warmup_epochs: 3
  checkpoint_dir: results/checkpoints
  log_dir: results/logs
  save_every: 5

conformal:
  enabled: true
  method: raps
  alpha_levels: [0.01, 0.05, 0.10, 0.20]
  k_reg: 5
  lambda_reg: 0.01
  cal_fraction: 0.5
