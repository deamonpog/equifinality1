# Trajectory transformer on rotation-invariant per-agent features, small model.
#
# 2 layers, d = 48, ~148k parameters (Table 2 row 1). Same data, folds and
# training budget as configs/fish_transformer_inv.yaml. The paper's numbers
# come from the run tagged transformer_inv_T64_small_verify:
#   python scripts/fish/09_train_fish_transformer.py \
#       --config configs/fish_transformer_inv_small.yaml \
#       --tag transformer_inv_T64_small_verify

tag: transformer_inv_T64_small

window: 64
features: invariant     # all | basic | invariant
folds: [0, 1, 2, 3, 4]
seed: 20260713

d_model: 48
n_heads: 4
n_layers: 2
dropout: 0.1

batch_size: 64
epochs: 120             # was 40, and val accuracy had not plateaued
patience: 25
lr: 3.0e-4
weight_decay: 0.01
label_smoothing: 0.05
num_workers: 0

augment:
  enabled: true
  rotate: true          # auto-disabled for invariant features (a no-op there)
  reflect: true         # still meaningful: it flips the sign of the focal-frame sines
  permute: true

alphas: [0.05, 0.10, 0.20]
raps_lambda: 0.1
raps_k_reg: 2
